    <!-- Données structurées (Google) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Luca Chaboissier",
        "jobTitle": "Développeur Backend PHP / Symfony",

        "sameAs": ["https://github.com/lchbssr", "https://www.linkedin.com/in/luca-chaboissier/"]
      }
    </script>

    <!-- Applique le thème avant le premier rendu pour éviter le flash clair/sombre -->
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.classList.add(theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
